<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akana</title>
<meta name="description" content="Guided workbooks from the books you read.">
<meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1719" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650&family=Lexend:wght@400;600&display=swap">
<style>
/* Daylight Blocks. A calm neutral shell; each workbook and stage brings one colour block.
   Spacing scale: 4 8 12 16 24 32 40. Radius scale: 12 16 20 24 28. Type scale: 13 15 17 20 24 30 40. */
:root{
  --canvas:#F7F5F0; --surface:#FFFFFF; --surface-2:#EFECE4; --line:#E2DED3; --line-strong:#7D878D;
  --ink:#16222B; --ink-soft:#4A5864; --brand:#1F4E5A; --brand-ink:#FFFFFF; --brand-wash:#E3EDEE;
  --marigold:#F2B84B; --marigold-ink:#3B2A05;
  --rose:#8A2846; --rose-soft:#F6E3E9; --rose-ink:#FFFFFF; --help-bg:#8A2846; --help-ink:#FFFFFF;
  --map-t:#DCEBE2; --map-i:#2D6A4F; --build-t:#F8E0D0; --build-i:#9C4A25;
  --use-t:#F6EAC0; --use-i:#6E520F; --keep-t:#D6E6F3; --keep-i:#1F5A85;
  --tile-l:.935; --tile-c:.045; --tink-l:.42; --tink-c:.11;
  --hero-bg:#1F4E5A; --hero-ink:#FFFFFF; --focus:#1F4E5A;
  --scrim:rgba(22,34,43,.42); --shadow:0 1px 2px rgba(22,34,43,.04),0 6px 20px rgba(22,34,43,.05); --lift:0 2px 6px rgba(22,34,43,.08),0 14px 34px rgba(22,34,43,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:17px; --ease:cubic-bezier(.2,.7,.2,1); --spring:cubic-bezier(.34,1.4,.64,1);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:40px;
  --r1:12px; --r2:16px; --r3:20px; --r4:24px; --r5:28px;
  --st:var(--map-t); --si:var(--map-i);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0F1719; --surface:#172226; --surface-2:#1E2B30; --line:#2A3A40; --line-strong:#6A7E84;
  --ink:#ECEFEA; --ink-soft:#A9B6B9; --brand:#7FC2CF; --brand-ink:#0F1719; --brand-wash:#1B3238;
  --marigold:#E3AA45; --marigold-ink:#2A1D03; --rose:#E58BA6; --rose-soft:#3A1F29; --rose-ink:#2A0E18; --help-bg:#5A2238; --help-ink:#FBE6EE;
  --map-t:#1C3328; --map-i:#8FD1AE; --build-t:#3A2419; --build-i:#F2AE86; --use-t:#33290E; --use-i:#E6C46A; --keep-t:#172B3C; --keep-i:#93C2EA;
  --tile-l:.28; --tile-c:.035; --tink-l:.84; --tink-c:.08; --hero-bg:#173C45; --hero-ink:#F2F5F2; --focus:#9AD3DE;
  --scrim:rgba(0,0,0,.6); --shadow:none; --lift:0 12px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --canvas:#0F1719; --surface:#172226; --surface-2:#1E2B30; --line:#2A3A40; --line-strong:#6A7E84;
  --ink:#ECEFEA; --ink-soft:#A9B6B9; --brand:#7FC2CF; --brand-ink:#0F1719; --brand-wash:#1B3238;
  --marigold:#E3AA45; --marigold-ink:#2A1D03; --rose:#E58BA6; --rose-soft:#3A1F29; --rose-ink:#2A0E18; --help-bg:#5A2238; --help-ink:#FBE6EE;
  --map-t:#1C3328; --map-i:#8FD1AE; --build-t:#3A2419; --build-i:#F2AE86; --use-t:#33290E; --use-i:#E6C46A; --keep-t:#172B3C; --keep-i:#93C2EA;
  --tile-l:.28; --tile-c:.035; --tink-l:.84; --tink-c:.08; --hero-bg:#173C45; --hero-ink:#F2F5F2; --focus:#9AD3DE;
  --scrim:rgba(0,0,0,.6); --shadow:none; --lift:0 12px 40px rgba(0,0,0,.45); color-scheme:dark}
:root[data-font="lexend"]{--f-body:"Lexend",system-ui,sans-serif}
:root.dim{filter:saturate(.8) brightness(.94)}
[data-stage="map"]{--st:var(--map-t);--si:var(--map-i)}
[data-stage="build"]{--st:var(--build-t);--si:var(--build-i)}
[data-stage="use"]{--st:var(--use-t);--si:var(--use-i)}
[data-stage="keep"]{--st:var(--keep-t);--si:var(--keep-i)}

*{box-sizing:border-box}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
::selection{background:var(--marigold);color:var(--marigold-ink)}
:focus{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:10px}
.btn:focus-visible,.chip:focus-visible,.help:focus-visible,.seg button:focus-visible{border-radius:999px}
.hero :focus-visible,.hero-band :focus-visible{outline-color:var(--marigold)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:24px;height:24px;flex:none;display:block}
.ico.s16{width:16px;height:16px}.ico.s20{width:20px;height:20px}.ico.s32{width:32px;height:32px}
h1,h2,h3{font-family:var(--f-display);font-weight:650;letter-spacing:-.018em;margin:0;text-wrap:balance;line-height:1.12;font-optical-sizing:auto}
h1{font-size:30px} h2{font-size:24px;letter-spacing:-.014em} h3{font-size:20px;letter-spacing:-.01em;line-height:1.2}
p{margin:0;text-wrap:pretty}
.muted,.soft{color:var(--ink-soft)} .small{font-size:15px;line-height:1.5}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);line-height:1.4}

/* Shell */
.shell{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.focus .shell{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--canvas) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px}
.brand{display:flex;align-items:center;gap:var(--s2);min-height:44px;font-family:var(--f-display);font-weight:650;font-size:20px;letter-spacing:-.02em;margin-right:auto;background:none;border:0;padding:0 6px 0 0;color:var(--ink)}
.help{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px 0 13px;border-radius:999px;border:1.5px solid var(--rose);color:var(--rose);background:transparent;font-weight:700;font-size:15px;flex:none;transition:background .15s var(--ease)}
.back{display:inline-flex;align-items:center;gap:var(--s1);min-height:44px;min-width:44px;padding:0 12px 0 0;border:0;background:none;color:var(--ink);font-weight:700;margin-right:auto}
.back .ico{width:22px;height:22px}
main{padding:var(--s1) 16px var(--s6);display:flex;flex-direction:column;gap:var(--s5)}
main:focus-visible{outline:none}
main.enter{animation:enter .28s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0 8px;border:0;background:none;color:var(--ink-soft);font-size:12.5px;font-weight:700;min-height:60px;letter-spacing:.01em}
.tab .ico{width:58px;height:30px;padding:3px 17px;border-radius:999px;transition:background .2s var(--ease)}
.tab[aria-current="page"]{color:var(--brand)}
.tab[aria-current="page"] .ico{background:var(--brand-wash)}
.tab:focus-visible{outline-offset:-4px;border-radius:14px}
#actionbar{position:fixed;left:0;right:0;bottom:0;z-index:7;pointer-events:none}
.actionbar{max-width:560px;margin:0 auto;padding:20px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--canvas) 62%,color-mix(in srgb,var(--canvas) 0%,transparent));display:flex;gap:var(--s3);pointer-events:auto}
.actionbar .btn{flex:1;min-height:54px;font-size:17.5px}
#tabs[hidden]{display:none}

/* Pieces */
.card{background:var(--surface);border-radius:var(--r3);box-shadow:var(--shadow);border:1px solid var(--line);padding:var(--s4) 18px;display:flex;flex-direction:column;gap:var(--s3)}
.card.flat{box-shadow:none;background:var(--surface-2);border-color:transparent}
.card > h2,.card > h3{font-size:19px;letter-spacing:-.01em;line-height:1.2}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:50px;padding:10px 22px;border-radius:999px;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;line-height:1.25;text-align:center;letter-spacing:.005em;transition:transform .14s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn[disabled]{background:var(--surface-2);color:var(--ink-soft);border-color:transparent;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.quiet{background:var(--surface-2);color:var(--ink)}
main > .btn.quiet{justify-content:flex-start;text-align:left;border-radius:var(--r2);padding:12px 18px;font-weight:600}
main > .btn.quiet .ico{color:var(--brand)}
.btn.danger{background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
.btn.small{min-height:44px;font-size:15px;padding:6px 16px}
.btn.stage{background:var(--si);color:var(--st)}
@media (hover:hover){
  .btn:not([disabled]):not(.ghost):not(.quiet):not(.danger):hover{filter:brightness(1.07) saturate(1.05)}
  .btn.ghost:hover,.btn.quiet:hover{background:color-mix(in srgb,var(--ink) 6%,var(--surface-2))}
  .btn.danger:hover,.help:hover{background:var(--rose-soft)}
  .list>.item:hover,.exlink:not([disabled]):hover{background:color-mix(in srgb,var(--ink) 3.5%,transparent)}
  .chip:not([aria-pressed="true"]):hover{border-color:var(--line-strong)}
  .wbcard:hover,.toolbtn:hover,.choice button:hover{transform:translateY(-2px);box-shadow:var(--lift)}
  .cover:hover img{transform:translateY(-3px);box-shadow:var(--lift)}
}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-align:left;min-height:44px;display:inline-flex;align-items:center;align-self:flex-start}
p .link,.small .link{min-height:0;display:inline}
.row{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:14px;font-weight:700;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;flex:none}
.pill.stage{background:var(--st);color:var(--si)}
.tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--st);color:var(--si)}
.tile .ico{width:26px;height:26px}
.tile.sm{width:36px;height:36px;border-radius:11px}.tile.sm .ico{width:21px;height:21px}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;align-items:center;gap:14px;min-height:60px;padding:13px 16px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line);color:var(--ink);transition:background .15s}
.list>.item:first-child{border-top:0;border-radius:var(--r3) var(--r3) 0 0}
.list>.item:last-child{border-radius:0 0 var(--r3) var(--r3)}
.list>.item:only-child{border-radius:var(--r3)}
.list>.item:focus-visible{outline-offset:-3px}
.card.list{padding:0;gap:0;overflow:visible}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;line-height:1.3}
.item .val{color:var(--ink-soft);font-size:15px;line-height:1.4;margin-top:2px}
.chev{color:var(--ink-soft)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.note{font-size:15px;line-height:1.5;color:var(--ink-soft);background:var(--surface-2);border-radius:var(--r2);padding:12px 16px}
.note>.ico:first-child{display:inline-block;vertical-align:-3px;margin-right:6px}
.banner{border-radius:var(--r2);padding:var(--s4);background:var(--keep-t);color:var(--ink);display:flex;gap:var(--s3);align-items:flex-start}
.banner .ico{color:var(--keep-i)}
.group-label{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);padding:0 4px var(--s2)}

/* Forms */
.q{display:block;font-weight:700;margin-bottom:var(--s2);line-height:1.35}
input[type=text],input[type=email],input[type=password],input[type=time],textarea{width:100%;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:52px;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--ink-soft);opacity:.85}
textarea{min-height:128px;resize:vertical;line-height:1.5}
input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 28%,transparent)}
input:disabled,textarea:disabled{opacity:.7}
.chips{display:flex;gap:var(--s2);flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;min-height:44px;min-width:44px;display:inline-flex;gap:6px;align-items:center;justify-content:center;line-height:1.25;transition:background .15s,border-color .15s,color .15s,transform .12s var(--ease)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.chip[disabled]{opacity:.55;cursor:not-allowed}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 14px,#000 calc(100% - 28px),transparent)}
.chips.scroll::-webkit-scrollbar,.tools::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none;scroll-snap-align:start}
.chip .n{font-weight:400;opacity:.75}
/* Number scales sit on one even row instead of wrapping into a ragged block */
.grid-rate{display:grid;grid-template-columns:1fr;gap:6px 12px}
.grid-rate>span{font-weight:700;margin-top:var(--s3);line-height:1.35}
.grid-rate>span:first-child{margin-top:0}
.grid-rate .chips,.chips:has(>[data-tog]){display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:6px}
.chips:has(>[data-tog]){--n:7}
.chips:has(>[data-set]),.chips:has(>[data-daily]),.dailyrow{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.grid-rate .chip,.chips:has(>[data-tog]) .chip,.chips:has(>[data-set]) .chip,.chips:has(>[data-daily]) .chip,.dailyrow .chip{padding:0;min-width:0;border-radius:12px;font-variant-numeric:tabular-nums}
/* Self-check answers: one calm vertical scale, easy to hit, easy to read */
.chips:has(>[data-sc]){display:flex;flex-direction:column;gap:0;border:1.5px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
.chips:has(>[data-sc]) .chip{border:0;border-top:1px solid var(--line);border-radius:0;justify-content:flex-start;min-height:48px;padding:10px 16px;font-weight:600;gap:12px}
.chips:has(>[data-sc]) .chip:first-child{border-top:0}
.chips:has(>[data-sc]) .chip::before{content:"";width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);flex:none;box-sizing:border-box;transition:border-width .15s,border-color .15s}
.chips:has(>[data-sc]) .chip[aria-pressed="true"]{background:var(--brand-wash);color:var(--ink)}
.chips:has(>[data-sc]) .chip[aria-pressed="true"]::before{border:6px solid var(--brand)}
.chips:has(>[data-sc]) .chip:focus-visible{outline-offset:-3px;border-radius:0}
.chips:has(>[data-sc]) .chip:active{transform:none}
.card:has(> .chips > [data-sc]){background:none;border:0;box-shadow:none;padding:0;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
label.check{display:flex;gap:var(--s3);align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r2);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s;line-height:1.45}
label.check:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand-wash) 60%,var(--surface))}
label.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--brand)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:14px 16px;min-height:60px;cursor:pointer}
.toggle + .toggle{border-top:1px solid var(--line)}
.toggle .small{display:block;margin-top:2px;line-height:1.4}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;margin:0;border-radius:999px;background:var(--line-strong);position:relative;flex:none;transition:background .18s var(--ease);cursor:pointer}
.switch::after{content:"";position:absolute;width:26px;height:26px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s var(--ease)}
.switch:checked{background:var(--brand)}
.switch:checked::after{transform:translateX(20px);background:var(--brand-ink)}
.switch:focus-visible{border-radius:999px}
.saved{font-size:14px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.saved.on{color:var(--map-i)}
.progressbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.progressbar span{display:block;height:100%;background:var(--si);border-radius:9px;transition:width .4s var(--ease)}
details>summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:var(--s2);min-height:44px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);margin-left:auto;margin-right:4px;transition:transform .2s var(--ease);flex:none;opacity:.7}
details[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
details.card{gap:var(--s2);padding-top:8px;padding-bottom:8px}
details.card[open]{padding-bottom:var(--s4)}

/* Steps */
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:var(--s4);counter-reset:s}
.steps li{display:flex;gap:var(--s3);align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:9px;background:var(--st);color:var(--si);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;margin-top:0;font-variant-numeric:tabular-nums}
.steps li p{max-width:60ch}

/* Hero and blocks */
.hero{position:relative;border-radius:var(--r5);overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);padding:28px 24px 0;display:flex;flex-direction:column;gap:var(--s4);isolation:isolate}
.hero h1{font-size:42px;line-height:1;letter-spacing:-.03em}
.hero h1 span{color:var(--marigold)}
.hero p{max-width:32ch;opacity:.92}
.hero .btn{background:var(--marigold);color:var(--marigold-ink);align-self:flex-start;min-height:52px;padding:0 26px}
.hero-band{position:relative;border-radius:var(--r4);overflow:hidden;background:var(--hero-bg);color:var(--hero-ink);padding:20px 20px 0;display:flex;flex-direction:column;gap:6px}
.hero-band p{opacity:.88;font-size:15.5px}
.hero-band h1{font-size:30px;line-height:1.08;letter-spacing:-.025em;max-width:16ch}
.marquee{display:flex;flex-direction:column;gap:10px;margin:8px -24px 0;padding-bottom:18px;transform:rotate(-4deg) translateY(6px)}
.lane{display:flex;gap:10px;width:max-content;animation:drift 70s linear infinite}
.lane.rev{animation-direction:reverse;animation-duration:84s}
.lane img{width:78px;height:125px;object-fit:cover;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.28);flex:none;background:rgba(255,255,255,.08)}
.hero-band .lane img{width:56px;height:90px}
.hero-band .marquee{padding-bottom:12px;margin:10px -20px 0}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.rise rect{transform-box:fill-box;transform-origin:bottom;animation:rise .7s var(--ease) both}
.rise rect:nth-child(2){animation-delay:.12s}.rise rect:nth-child(3){animation-delay:.24s}
@keyframes rise{from{transform:scaleY(.1);opacity:0}}
/* How it works: one quiet panel with three coloured rows, not three cramped boxes */
.steps3{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow)}
.steps3 div{display:grid;grid-template-columns:44px 1fr;column-gap:14px;row-gap:2px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.4}
.steps3 div:first-child{border-top:0}
.steps3 .ico{grid-row:span 2;width:44px;height:44px;padding:10px;border-radius:13px;background:var(--map-t);color:var(--map-i)}
.steps3 div:nth-child(2) .ico{background:var(--build-t);color:var(--build-i)}
.steps3 div:nth-child(3) .ico{background:var(--keep-t);color:var(--keep-i)}
.steps3 b{font-family:var(--f-display);font-size:17px;color:var(--ink);align-self:end;line-height:1.2}
.steps3 span{color:var(--ink-soft);align-self:start}
.genres{display:flex;gap:var(--s2);flex-wrap:wrap}
.genre{border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;background:var(--surface);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.genre:not(.soon){background:var(--map-t);color:var(--map-i);border-color:transparent}
.genre.soon{color:var(--ink-soft);background:transparent;border-style:dashed;border-color:var(--line-strong);font-weight:600}
.stage-block{background:var(--st);color:var(--ink);border-radius:var(--r4);padding:22px 20px 20px;display:flex;flex-direction:column;gap:var(--s4);position:relative;overflow:hidden;isolation:isolate}
.stage-block h2{font-size:26px;letter-spacing:-.02em}
.stage-block .tag{color:var(--si);font-weight:700;font-size:14px;display:flex;align-items:center;gap:var(--s2);letter-spacing:.01em}
.stage-block .art{position:absolute;right:-4px;top:-2px;width:100px;height:84px;pointer-events:none;z-index:-1}
.stage-block .text{display:flex;flex-direction:column;gap:6px}
.stage-block .tag{padding-right:92px}
.stage-block .text h1,.stage-block .text h2{padding-right:68px}
.stage-block .text p{margin-top:0!important}
.stage-block > .row{gap:var(--s3)}
.stage-block .link{color:var(--si)!important;margin-top:-6px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:14px 16px;border-radius:var(--r2);border:0;background:var(--surface);color:var(--ink);text-align:left;font-weight:700;font-size:17px;line-height:1.25;min-height:72px;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.choice button span{font-weight:400;font-size:14px;color:var(--ink-soft)}
.choice button.primary{background:var(--si);color:var(--st)}
.choice button.primary span{color:var(--st);opacity:.92}
.choice button:active{transform:scale(.98)}
.checklist .check-row{display:flex;gap:var(--s3);align-items:center;padding:8px 0;line-height:1.35}
.checklist .check-row + .check-row{border-top:1px dashed var(--line)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none}
.dot.done{background:var(--si);border-color:var(--si);color:var(--st)}
.check-row.done .t{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ink-soft) 50%,transparent)}
.tools{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:16px}
.toolbtn{flex:none;width:120px;min-height:120px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px;border-radius:var(--r3);border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:700;font-size:14.5px;line-height:1.3;color:var(--ink);scroll-snap-align:start;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.toolbtn .tile{background:var(--map-t);color:var(--map-i)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;min-height:44px;padding:6px 4px;font-weight:700;font-size:14.5px;color:var(--ink-soft);line-height:1.2;transition:background .18s var(--ease),color .18s}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.switcher{display:flex;align-items:center;gap:var(--s3)}
.switcher h1{font-size:24px;line-height:1.1}
.switcher .tile{width:44px;height:44px;border-radius:13px}
.dailyrow .chip{min-height:44px;font-size:15px}
body.night .stage-block{filter:saturate(.75)}

/* Workbook tiles */
.wb{--tile:oklch(var(--tile-l) var(--tile-c) var(--h));--tink:oklch(var(--tink-l) var(--tink-c) var(--h))}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.wbcard{background:var(--tile);border-radius:var(--r3);padding:16px 14px 14px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left;min-height:176px;color:var(--ink);transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.wbcard .tile{background:var(--surface);color:var(--tink);width:44px;height:44px;border-radius:13px;margin-bottom:6px}
.wbcard h3{font-size:18px}
.wbcard .from{font-size:13.5px;color:var(--ink-soft);line-height:1.35}
.wbcard .state{margin-top:auto;padding-top:6px;font-size:14px;font-weight:700;color:var(--tink);display:flex;align-items:center;gap:6px;line-height:1.3}
.wbcard:not(.soon) .state{color:var(--ink)}
.wbcard:not(.soon) .state .ico{color:var(--tink)}
.wbcard:not(.soon){box-shadow:inset 0 0 0 2px var(--tink)}
.wbcard.soon{filter:saturate(.45)}
/* So far: one panel split four ways */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow);overflow:hidden}
.dash .cell{padding:16px;display:flex;flex-direction:column;gap:6px;border:0}
.dash .cell:nth-child(odd){border-right:1px solid var(--line)}
.dash .cell:nth-child(n+3){border-top:1px solid var(--line)}
.dash .cell .tile{margin-bottom:4px}
.dash .cell .small{line-height:1.3}
.dash .cell b{font-family:var(--f-display);font-size:18px;line-height:1.2;font-weight:650}

/* Path: a quiet timeline; only this week is lifted */
.wk{border-radius:0;background:none;border:0;border-top:1px solid var(--line);padding:2px 4px}
p.eyebrow + .wk,.wk:first-child{border-top:0}
.wk.now{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow);padding:4px 14px;margin:6px 0}
.wk.now + .wk{border-top:0}
.wk summary{padding:12px 0;gap:var(--s3);line-height:1.3}
.wk summary .small{display:inline-block;margin-top:2px;font-weight:400}
.wk .node{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--st);color:var(--si);flex:none}
.wk .node:has(svg){background:var(--si);color:var(--st)}
.wk.now .node{background:var(--si);color:var(--st);box-shadow:0 0 0 4px color-mix(in srgb,var(--si) 22%,transparent)}
.wk .body{display:flex;flex-direction:column;padding:0 0 12px 44px}
p.eyebrow:has(+ .wk){display:flex;align-items:center;gap:8px;margin-top:14px!important}
p.eyebrow:has(+ .wk)::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--si)}
p.eyebrow:has(+ .wk[data-stage="map"]){--si:var(--map-i)} p.eyebrow:has(+ .wk[data-stage="build"]){--si:var(--build-i)}
p.eyebrow:has(+ .wk[data-stage="use"]){--si:var(--use-i)} p.eyebrow:has(+ .wk[data-stage="keep"]){--si:var(--keep-i)}
.exlink{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:48px;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink);font-weight:600;line-height:1.35}
.exlink[disabled]{color:var(--ink-soft);cursor:default}
.exlink:focus-visible{outline-offset:-2px}

/* Progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow);overflow:hidden}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.stat:nth-child(odd){border-right:1px solid var(--line)}
.stat:nth-child(n+3){border-top:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-size:34px;line-height:1.05;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar .track{position:relative;height:10px;border-radius:9px;background:var(--surface-2);margin-top:8px}
.bar .fill,.legend i.lg-start{background:color-mix(in srgb,var(--si) 38%,var(--surface-2))}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px}
.bar .now{position:absolute;top:-4px;width:18px;height:18px;border-radius:50%;background:var(--si);transform:translateX(-50%);border:3px solid var(--surface)}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:14px;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

/* Books */
.covers{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5) 14px}
.cover{border:0;padding:0;background:none;text-align:left;display:flex;flex-direction:column;gap:10px;color:var(--ink);border-radius:12px}
.cover img,.cover .plain{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;box-shadow:0 1px 2px rgba(22,34,43,.08),0 8px 22px rgba(22,34,43,.12);display:block;max-width:100%;background:var(--surface-2);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.cover .plain{display:grid;place-items:center;padding:12px;text-align:center;font-family:var(--f-display);font-weight:650;font-size:18px;background:oklch(var(--tile-l) var(--tile-c) var(--h))}
.cover .meta{font-size:15px;font-weight:700;line-height:1.3}
.cover .meta span{display:block;font-weight:400;color:var(--ink-soft);font-size:13.5px;margin-top:2px}

/* Settings */
.profile{display:flex;align-items:center;gap:14px;padding:4px 0}
.profile h1{font-size:24px}
.avatar{width:56px;height:56px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:650;font-size:24px;flex:none}
.steps-size{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s2)}
.steps-size button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;min-height:52px;padding:6px 0;font-weight:700;line-height:1}
.steps-size button[aria-pressed="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-wash);box-shadow:inset 0 0 0 1px var(--brand)}
.locked{display:flex;align-items:center;gap:var(--s2);color:var(--ink-soft);font-size:14px}
section > .group-label + .card{margin-top:0}

/* Pacer: the word sits on a light core, so it reads at every size of the breath */
.pacer{display:flex;flex-direction:column;align-items:center;gap:var(--s4);padding:24px 16px 20px;border-radius:var(--r4);background:var(--st)}
.orb{width:180px;height:180px;display:grid;place-items:center;position:relative;margin-bottom:24px}
.orb .ring{position:absolute;inset:0;border-radius:50%;background:var(--si);opacity:.16;transform:scale(.62);transition:transform 4s cubic-bezier(.45,0,.55,1)}
.orb .core{position:absolute;inset:26px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px color-mix(in srgb,var(--si) 30%,transparent),0 8px 24px rgba(0,0,0,.08);transform:scale(.72);transition:transform 4s cubic-bezier(.45,0,.55,1)}
.orb .word{position:relative;font-family:var(--f-display);font-weight:650;font-size:23px;color:var(--si);letter-spacing:-.01em}
.orb .count{position:absolute;bottom:-32px;white-space:nowrap;font-size:14.5px;color:var(--si);font-weight:700}
.pacer .row{gap:10px}
.pacer label.row{min-height:44px;cursor:pointer}

/* Offers: radio cards with a real radio mark */
.card[role=radio]{flex-direction:row;align-items:center;gap:14px;text-align:left;cursor:pointer;min-height:76px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.card[role=radio] > span:first-child{flex:1}
.card[role=radio]::before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);flex:none;box-sizing:border-box;transition:border-width .15s,border-color .15s}
.card[role=radio][aria-checked="true"]{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand),var(--shadow)}
.card[role=radio][aria-checked="true"]::before{border:7px solid var(--brand)}
.card[role=radio][aria-checked="true"] .pill{background:var(--brand);color:var(--brand-ink)}

/* Sheet, toast, skeleton */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;animation:fade .2s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);max-width:560px;margin:0 auto;border-radius:var(--r5) var(--r5) 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--s4);max-height:88vh;overflow:auto;animation:up .32s var(--ease);text-align:center;box-shadow:0 -8px 40px rgba(0,0,0,.12)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet h2{font-size:26px}
.sheet .btn{width:100%}
.sheet .chips{justify-content:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(32px);opacity:.4}}
.bloom{width:88px;height:88px;border-radius:28px;background:var(--marigold);color:var(--marigold-ink);display:grid;place-items:center;margin:8px auto 4px;box-shadow:0 0 0 10px color-mix(in srgb,var(--marigold) 22%,transparent);animation:pop .55s var(--spring) both .05s}
.bloom .ico{width:40px;height:40px}
.bloom.calm{background:var(--keep-t);color:var(--keep-i);box-shadow:none;animation:none}
@keyframes pop{0%{transform:scale(.5) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
#toast{position:fixed;left:0;right:0;bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--canvas);border-radius:var(--r2);padding:13px 18px;max-width:440px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:up .26s var(--ease);font-weight:600;font-size:15.5px;line-height:1.4}
.sk{border-radius:var(--r2);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.contact{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:12px 0;border-top:1px solid var(--line)}
.contact:first-child{border-top:0}
.contact{flex-wrap:wrap}
.contact > div{flex:1 1 140px}
.contact .big{font-family:var(--f-display);font-weight:650;font-size:22px;user-select:all;font-variant-numeric:tabular-nums;white-space:nowrap}
.call{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 16px 6px 12px;border-radius:999px;background:var(--rose-soft);color:var(--rose);text-decoration:none;flex:none}
.call .big{color:var(--ink)}
.helphead{background:var(--help-bg);color:var(--help-ink);border-radius:var(--r4);padding:22px 20px;display:flex;flex-direction:column;gap:var(--s3)}
.helphead .row{gap:10px}
.spread{display:flex;flex-direction:column;gap:var(--s5)}
.spread .answers{display:flex;flex-direction:column;gap:22px;padding-top:var(--s5);border-top:1px solid var(--line)}
.spread .ref{display:flex;flex-direction:column;gap:var(--s3)}

/* Motion between screens: a short slide forwards and back, a cross-fade between tabs */
::view-transition-old(root),::view-transition-new(root){animation-duration:.24s;animation-timing-function:var(--ease)}
html[data-nav="fwd"]::view-transition-new(root){animation-name:vt-in-r}
html[data-nav="fwd"]::view-transition-old(root){animation-name:vt-out-l}
html[data-nav="back"]::view-transition-new(root){animation-name:vt-in-l}
html[data-nav="back"]::view-transition-old(root){animation-name:vt-out-r}
@keyframes vt-in-r{from{opacity:0;transform:translateX(16px)}}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-10px)}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-16px)}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(10px)}}

/* Narrow screens and 200% zoom */
@media (max-width:359px){
  .choice{grid-template-columns:1fr}
  .dailyrow,.chips:has(>[data-set]),.chips:has(>[data-daily]){grid-template-columns:repeat(6,1fr)}
  .hero h1{font-size:36px}
  .lib{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .dash,.stats{grid-template-columns:1fr}
  .dash .cell,.stat{border-right:0!important}
  .dash .cell:nth-child(n+2),.stat:nth-child(n+2){border-top:1px solid var(--line)}
}

/* Tablet: a centred reading column for most screens; Home, Books and the answer spread use the width */
@media (min-width:760px){
  .shell{max-width:920px}
  .top{padding-left:24px;padding-right:24px}
  main{padding:var(--s2) 24px var(--s7);max-width:680px;margin:0 auto;gap:28px}
  main:has(.lib),main:has(.covers),main:has(.spread),main:has(.hero){max-width:none}
  .tabs-in{max-width:600px}
  .actionbar{max-width:920px;justify-content:center;padding-left:24px;padding-right:24px}
  .actionbar .btn{flex:0 1 420px}
  .spread{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:start}
  .spread .ref{position:sticky;top:76px}
  .spread .answers{padding-top:0;border-top:0}
  .lib{grid-template-columns:repeat(3,1fr);gap:14px}
  .covers{grid-template-columns:repeat(4,1fr);gap:28px 18px}
  main:has(.lib){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 20px;align-items:stretch}
  main:has(.lib) > *{grid-column:1/-1}
  main:has(.lib) > .stage-block{grid-column:1}
  main:has(.lib) > .stage-block + section{grid-column:2;justify-content:flex-start}
  main:has(.lib) > .stage-block + section .dash{flex:1}
  .hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-content:center;padding:44px 0 0 40px;gap:var(--s4) 20px}
  .hero > *:not(.marquee){grid-column:1}
  .hero .marquee{grid-column:2;grid-row:1/span 4;margin:0;padding:24px 0}
  .hero h1{font-size:52px;max-width:11ch}
  .hero > .btn{margin-bottom:44px;justify-self:start;white-space:nowrap}
  .hero p{max-width:36ch}
  .steps3{display:grid;grid-template-columns:repeat(3,1fr)}
  .steps3 div{border-top:0;border-left:1px solid var(--line);grid-template-columns:1fr;align-items:start;padding:20px}
  .steps3 div:first-child{border-left:0}
  .steps3 .ico{grid-row:auto;margin-bottom:10px}
  .hero-band{padding:28px 28px 0}
  .hero-band h1{font-size:38px;max-width:20ch}
  .sheet{border-radius:var(--r5);bottom:24px;max-width:520px;padding-bottom:24px}
  #toast{bottom:100px}
}

@media print{#tabs,#actionbar,.top,.no-print{display:none!important}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  .wbcard:hover,.toolbtn:hover,.choice button:hover,.cover:hover img{transform:none}}
:root[data-motion="reduce"] *,:root[data-motion="reduce"] *::before,:root[data-motion="reduce"] *::after{animation:none!important;transition:none!important}
:root[data-motion="reduce"]::view-transition-group(*),:root[data-motion="reduce"]::view-transition-old(*),:root[data-motion="reduce"]::view-transition-new(*){animation:none!important}
:root[data-motion="reduce"] .wbcard:hover,:root[data-motion="reduce"] .toolbtn:hover,:root[data-motion="reduce"] .choice button:hover{transform:none}

__SPRITE__
<div class="shell">

</div>

<div id="toast" aria-live="polite"></div>
<script>
let D = __DATA__;
const LIVE = __LIVE__; // workbooks with written content in this build
const WB_DATA = {[D.id]: D};
const CAT = __CATALOG__;
const MARKETS = __MARKETS__;
const LINE_NAME = "Akana";
const FIVE_DAY_UNLOCK = false; // test build: weeks open straight away. Turn on for the pilot and launch.
const pref = (k, d) => { try{ const v = localStorage.getItem("pref:"+k); return v === null ? d : v; }catch(e){ return d; } };
const setPref = (k, v) => { try{ localStorage.setItem("pref:"+k, String(v)); }catch(e){} };
const buzz = () => { if(pref("haptics","1") === "1" && navigator.vibrate) try{ navigator.vibrate(12); }catch(e){} };

/* ---------- state ---------- */
const blank = () => ({view:"welcome", account:{name:"",email:""}, consents:{store:false,emails:false,recs:false,news:false},
  baseline:{}, retake:{}, retake12:{}, retakeWeek:6, why:"", dailyTime:"08:00", ex:{}, answers:{}, modes:{}, checkin:{}, checkinDone:{},
  daily:[], tool:{}, week:1, paid:false, ms:[], sc:0, dailyDraft:{score:null,tags:[]}, retaking:false, access:"full", filter:"all",
  prefs:{}, status:null, format:"kindle", enrolments:[]});
let S = blank();
function save(){} // Progress lives on the server. Nothing personal is kept in browser storage.
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let EX = {}, TK = {};
function setData(d){ D = d; WB_DATA[d.id] = d; EX = Object.fromEntries(D.exercises.map(e => [e.id, e])); TK = Object.fromEntries(D.toolkit.map(t => [t.id, t])); defineScViews(); }
async function loadData(id){
  if(WB_DATA[id]) return WB_DATA[id];
  const r = await fetch(`/workbooks/${id}.json`); if(!r.ok) throw new Error("This workbook couldn't load. Check your connection.");
  return WB_DATA[id] = await r.json();
}
const STAGE_NAME = {map:"Explore", build:"Build", use:"Practice", keep:"Keep"};

/* ---------- icons (Phosphor, MIT) and the stepped mark ---------- */
const I = (n, cls="") => `<svg class="ico ${cls}" aria-hidden="true"><use href="#${/^[ifd]-/.test(n) ? n : "i-"+n}"/></svg>`;
const MARK = (c="var(--brand)", s=26, anim=false) => `<svg class="${anim?"rise":""}" width="${s}" height="${s}" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="17" width="8" height="10" rx="2.4" fill="${c}" opacity=".55"/><rect x="10" y="10" width="8" height="17" rx="2.4" fill="${c}" opacity=".78"/><rect x="19" y="2" width="8" height="25" rx="2.4" fill="${c}"/></svg>`;
const FIG_ICON = {fig_writing:"pencil-simple-line", fig_clock_check:"clock", fig_calendar:"calendar-blank", fig_thinking:"lightbulb", fig_phone_quick:"device-mobile",
  fig_reading:"book-open-text", fig_two_people:"handshake", fig_desk_ready:"desk", fig_walking:"path", fig_phone_down:"device-mobile-slash", fig_door:"door",
  fig_hand_raised:"hand-palm", fig_clear_desk:"broom", fig_three_cards:"cards", fig_circling:"target", fig_rating:"chart-bar", fig_moon:"moon-stars",
  fig_looking_at_map:"map-trifold", fig_board:"kanban", fig_folders:"folders", fig_feet_grounded:"anchor"};
const TOOL_WORDS = [[/breath|sigh|inhale/i,"wind"],[/walk|move/i,"path"],[/\bno\b|limit|boundar|brake/i,"hand-palm"],[/sleep|night|wind-down/i,"moon-stars"],[/worry time|timer|minute|24-hour/i,"timer"],
  [/thought|record|write|draft|journal|note/i,"pencil-simple-line"],[/plan|list|check/i,"list-checks"],[/body|muscle|ground|feet/i,"anchor"],[/kind|warm|repair|compassion/i,"hand-heart"],[/restart|drift|reset/i,"arrow-counter-clockwise"],[/good enough|capacity|energy/i,"chart-bar"]];
const toolIcon = t => (D.id === "focus" && TOOL_ICON[t.id]) || (TOOL_WORDS.find(([re]) => re.test(t.title)) || [])[1] || FIG_ICON[t.figure] || "lightbulb";
const wbIcon = (id = WB) => WB_ICON[id] || "book-open";
const TOOL_ICON = {t01:"wind", t02:"hand-palm", t03:"lightbulb", t04:"timer", t05:"hourglass-medium", t06:"envelope-simple", t07:"notepad", t08:"broom", t09:"hand-heart", t10:"arrow-counter-clockwise"};
const WB_ICON = {worry:"wind", panic:"anchor", social:"handshake", doubt:"question", lowmood:"sun-horizon", movement:"path", food:"plant", steady:"target", stress:"clock",
  burnout:"arrow-counter-clockwise", overwhelm:"notepad", focus:"timer", aftertrauma:"shield-check", childhood:"door", grief:"hand-heart", drinking:"map-trifold",
  selfworth:"sparkle", connection:"user", sleep:"moon-stars", mindfulness:"lightbulb"};
const tileFor = (fig, cls="") => `<span class="tile ${cls}">${I("d-" + (FIG_ICON[fig] || "book-open"))}</span>`;
function art(stage){
  const h = {map:[18,30,22], build:[14,26,40], use:[24,40,30], keep:[30,30,30]}[stage] || [20,30,40], x = [20,52,84];
  return `<svg class="art" viewBox="0 0 132 110" aria-hidden="true">${h.map((v,i)=>`<rect x="${x[i]}" y="${96-v*2}" width="26" height="${v*2}" rx="7" fill="var(--si)" opacity="${.25+i*.18}"/>`).join("")}<rect x="${x[2]}" y="${96-h[2]*2-14}" width="26" height="8" rx="4" fill="var(--marigold)"/></svg>`;
}
const coverSrc = id => `/covers/${id}-400.webp`;
function lanes(n = 2){
  const ids = CAT.books.map(b => b.id), a = ids.slice(0, 10), b = ids.slice(10);
  const lane = (l, rev) => `<div class="lane ${rev?"rev":""}">${[...l, ...l].map(id => `<img src="${coverSrc(id)}" alt="" loading="lazy" decoding="async">`).join("")}</div>`;
  return `<div class="marquee" aria-hidden="true">${lane(a)}${n > 1 ? lane(b, true) : ""}</div>`;
}
const hideCovers = () => !!S.prefs.hide_covers;
const market = () => (window.AkanaLocale && AkanaLocale.current() && AkanaLocale.current().market) || null;
const marketCode = () => { const c = window.AkanaLocale && AkanaLocale.current(); return c && c.market ? c.market.code : "XX"; };

/* ---------- helpers ---------- */
function toast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.innerHTML = "", 3800);
}
function milestone(trigger, vars={}){
  const m = D.milestones.find(x => x.trigger === trigger);
  if(!m || S.ms.includes(m.id)) return;
  S.ms.push(m.id); Sync.milestone(m.id);
  const text = m.message.replace(/\{(\w+)\}/g, (_,k) => vars[k] ?? "");
  const [head, ...rest] = text.split(/(?<=\.)\s+/);
  sheet(`<span class="bloom">${I("check","s32")}</span><h2>${esc(head)}</h2>${rest.length?`<p class="muted">${esc(rest.join(" "))}</p>`:""}<button class="btn" data-action="close-sheet">Keep going</button>`, "Milestone");
  buzz();
}
function sheet(html, label="Dialog"){
  const el = document.getElementById("sheet");
  el.innerHTML = `<div class="scrim" data-action="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}"><div class="grab"></div>${html}</div>`;
  setTimeout(() => el.querySelector(".sheet .btn, .sheet input")?.focus(), 50);
}
function closeSheet(){ document.getElementById("sheet").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
const scStore = () => S.retaking ? (S.retakeWeek === 12 ? S.retake12 : S.retake) : S.baseline;
const scTaken = w => Object.keys(w === 12 ? S.retake12 : w === 6 ? S.retake : S.baseline).length === D.selfcheck.items.length && (w === 0 || S["scSaved" + w]);
const areaScore = (answers, area) => {
  const items = D.selfcheck.items.filter(i => i.area === area);
  const vals = items.map(i => answers[i.id]).filter(v => v !== undefined && v !== null);
  return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
};
const exDoneCount = () => Object.keys(S.ex).filter(k => !isRepeat(k)).length;
const baseId = id => String(id).split("~")[0];
const isRepeat = id => String(id).includes("~");
const repeatWeek = id => (EX[baseId(id)]?.repeat_weeks || [])[0];
const weekOf = id => isRepeat(id) ? repeatWeek(id) : D.weeks.find(w => w.exercise_ids.includes(id))?.number;
const readOnly = () => S.access === "read_only" || !!(S.status && S.status.deletion);
const TAB_OF = {home:"home", today:"today", path:"today", progress:"today", plan:"today", toolkit:"toolkit", books:"books", you:"you"};
function go(view, nav){
  nav = nav || (TAB_OF[view] ? "tab" : "fwd");
  const swap = () => { S.view = view; render(); window.scrollTo(0, 0); };
  if(document.startViewTransition && pref("motion","phone") !== "reduce" && !matchMedia("(prefers-reduced-motion: reduce)").matches && S.view !== view){
    document.documentElement.dataset.nav = nav; document.startViewTransition(swap);
  } else swap();
}
const longDate = d => new Date(d).toLocaleDateString(undefined, {month:"long", day:"numeric", year:"numeric"});

/* ---------- field rendering ---------- */
function fieldHTML(exId, f){
  const key = exId + "." + f.id, v = S.answers[key];
  const lbl = `<label class="q" for="${esc(key)}">${esc(f.label)}${f.optional?' <span class="muted small">(optional)</span>':''}</label>${f.help?`<p class="muted small" style="margin:-2px 0 8px">${esc(f.help)}</p>`:''}`;
  switch(f.type){
    case "short_text": return `<div>${lbl}<input type="text" id="${esc(key)}" data-k="${esc(key)}" value="${esc(v||"")}"></div>`;
    case "time_of_day": return `<div>${lbl}<input type="time" id="${esc(key)}" data-k="${esc(key)}" value="${esc(v||"")}" style="max-width:200px"></div>`;
    case "long_text": return `<div>${lbl}<textarea id="${esc(key)}" data-k="${esc(key)}">${esc(v||"")}</textarea></div>`;
    case "ranked_list": {
      const arr = v || []; let h = `<div><span class="q">${esc(f.label)}</span>${f.help?`<p class="muted small" style="margin:-2px 0 8px">${esc(f.help)}</p>`:''}<div style="display:flex;flex-direction:column;gap:8px">`;
      for(let i=0;i<(f.max_items||3);i++) h += `<input type="text" aria-label="${esc(f.label)} ${i+1}" id="${esc(key)}.${i}" data-k="${esc(key)}" data-i="${i}" value="${esc(arr[i]||"")}" placeholder="${i+1}.">`;
      return h + `</div></div>`; }
    case "two_column": {
      const arr = v || [["",""],["",""]]; let h = `<div><span class="q">${esc(f.label)}</span>${f.help?`<p class="muted small" style="margin:-2px 0 8px">${esc(f.help)}</p>`:''}<div class="two small muted"><span>${esc(f.columns[0])}</span><span>${esc(f.columns[1])}</span></div>`;
      arr.forEach((r,i) => h += `<div class="two" style="margin-top:8px"><input type="text" aria-label="${esc(f.columns[0])} ${i+1}" id="${esc(key)}.${i}.0" data-k="${esc(key)}" data-i="${i}" data-j="0" value="${esc(r[0])}"><input type="text" aria-label="${esc(f.columns[1])} ${i+1}" id="${esc(key)}.${i}.1" data-k="${esc(key)}" data-i="${i}" data-j="1" value="${esc(r[1])}"></div>`);
      return h + `</div>`; }
    case "rating_grid": {
      const m = v || {}; let h = `<div><span class="q">${esc(f.label)}</span><p class="muted small" style="margin-bottom:6px">1 is often hard. 5 is usually fine.</p><div class="grid-rate">`;
      f.rows.forEach((r,ri) => { h += `<span>${esc(r)}</span><div class="chips" role="group" aria-label="${esc(r)}">`;
        for(let n=1;n<=5;n++) h += `<button type="button" class="chip" data-grid="${esc(key)}" data-row="${ri}" data-n="${n}" aria-pressed="${m[ri]===n}">${n}</button>`;
        h += `</div>`; });
      return h + `</div></div>`; }
    case "weekly_grid": {
      if(f.rows){
        const m = v || {}; const day = S["day_"+key] ?? 0; const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
        let h = `<div><span class="q">${esc(f.label)}</span><div class="chips scroll" role="group" aria-label="Day" style="margin-bottom:12px">`;
        days.forEach((d,i) => h += `<button type="button" class="chip" data-day="${esc(key)}" data-i="${i}" aria-pressed="${i===day}">${d}</button>`);
        h += `</div><div class="grid-rate">`;
        f.rows.forEach((r,ri) => { const cell = (m[day]||{})[ri]; h += `<span class="small">${esc(r)}</span><div class="chips">`;
          for(let n=1;n<=5;n++) h += `<button type="button" class="chip" data-wg="${esc(key)}" data-day2="${day}" data-row="${ri}" data-n="${n}" aria-pressed="${cell===n}">${n}</button>`;
          h += `</div>`; });
        return h + `</div></div>`; }
      const arr = v || []; const days=["M","T","W","T","F","S","S"];
      let h = `<div><span class="q">${esc(f.label)}</span><div class="chips" role="group" aria-label="${esc(f.label)}">`;
      days.forEach((d,i) => h += `<button type="button" class="chip" data-tog="${esc(key)}" data-i="${i}" aria-pressed="${!!arr[i]}" aria-label="Day ${i+1}">${d}</button>`);
      return h + `</div></div>`; }
    case "yes_no": {
      return `<div><span class="q">${esc(f.label)}${f.optional?' <span class="muted small">(optional)</span>':''}</span>${f.help?`<p class="muted small" style="margin:-2px 0 8px">${esc(f.help)}</p>`:''}<div class="chips" role="group" aria-label="${esc(f.label)}">${[["yes","Yes"],["no","Not yet"]].map(([val,l]) => `<button type="button" class="chip" data-yn="${esc(key)}" data-v="${val}" aria-pressed="${v===val}">${l}</button>`).join("")}</div></div>`; }
    case "scale_0_10": {
      let h = `<div><span class="q">${esc(f.label)}</span><div class="chips" role="group" aria-label="${esc(f.label)}">`;
      for(let n=0;n<=10;n++) h += `<button type="button" class="chip" data-set="${esc(key)}" data-n="${n}" aria-pressed="${v===n}">${n}</button>`;
      return h + `</div></div>`; }
    case "checklist": {
      const opts = (f.options && f.options[0] !== "From your Toolkit") ? f.options : D.toolkit.map(t => t.title), arr = v || [];
      let h = `<div><span class="q">${esc(f.label)}</span><div style="display:flex;flex-direction:column;gap:8px">`;
      opts.forEach((o,i) => h += `<label class="check"><input type="checkbox" data-cl="${esc(key)}" data-i="${i}" ${arr[i]?"checked":""}><span>${esc(o)}</span></label>`);
      return h + `</div></div>`; }
  }
  return "";
}
function filled(exId, f){
  const v = S.answers[exId+"."+f.id];
  if(f.optional) return true;
  if(f.type === "rating_grid") return !!v && Object.keys(v).length === f.rows.length;
  if(v === undefined || v === null) return false;
  if(typeof v === "string") return v.trim().length > 0;
  if(Array.isArray(v)) return v.some(x => Array.isArray(x) ? x.some(y => String(y).trim()) : x && String(x).trim());
  if(typeof v === "object") return Object.keys(v).length > 0;
  return true;
}

  <p class="small muted">Test version. Payments are in test mode and no real card is charged.</p>`}; };
V["onb-check"] = () => ({title:"", back:"onb-account", body:`
  <span class="bloom calm">${I("envelope-simple","s32")}</span><h1 style="text-align:center">Check your email</h1>
  <p style="text-align:center">We sent a link to <b>${esc(S.account.email)}</b>. Open it on this device to carry on.</p>
  <p class="small muted" style="text-align:center">No email after a few minutes? Check your spam folder, then try again.</p>`});
V["loading"] = () => ({title:"", body:`<p class="muted small" role="status">${esc(S.loadingText||"Loading")}</p>
  <div class="sk" style="height:150px;border-radius:24px"></div><div class="sk" style="height:180px;border-radius:24px"></div><div class="sk" style="height:90px"></div>`});
V["onb-consent"] = () => ({title:"", body:`
  <h1>Before you start</h1>
  <p>Your progress, answers and check-ins are stored in your account, so you can pick up on any device. This is personal information, so we need your clear permission to keep it. It is never sold and never shared with advertisers.</p>
  <label class="check"><input type="checkbox" data-consent="store" ${S.consents.store?"checked":""}><span><b>Yes, store my workbook information.</b><br><span class="small muted">Required to use Akana.</span></span></label>

  <label class="check"><input type="checkbox" data-consent="recs" ${S.consents.recs?"checked":""}><span>Suggest other workbooks based on the ones I use. <span class="small muted">(Optional)</span></span></label>
  <p class="small muted">You can change any of these in You, then Emails, at any time.</p>`,
  action:`<button class="btn" data-action="save-consent" ${S.consents.store?"":"disabled"}>Continue</button>`});
V["start-welcome"] = () => ({title:"", body:`
  <section class="stage-block" data-stage="map">${art("map")}
    <span class="tag">${I("d-"+wbIcon(),"s20")}${esc(D.topic_name)}</span>

V["start-safety"] = () => ({title:"", back:"start-welcome", body:`
  <div class="row"><span class="tile" style="background:var(--rose-soft);color:var(--rose)">${I("d-shield-check")}</span><h1 style="font-size:28px;flex:1">Before you begin</h1></div>
  <p>This is a self-guided workbook for everyday life. It is not a medical service, and it does not diagnose or treat any condition. If you already work with a doctor or therapist, this can sit alongside that.</p>

function defineScViews(){
  Object.keys(V).filter(k => k.startsWith("start-sc-")).forEach(k => delete V[k]);
D.selfcheck.areas.forEach((a,ai) => {
  V["start-sc-"+ai] = () => {
    const store = scStore();

let pacerT = null;
const NUMW = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8};
function paceOf(id){
  const t = TK[id]; const text = t ? t.steps.join(" ").toLowerCase() : "";
  const n = re => { const m = text.match(re); if(!m) return null; const v = NUMW[m[1]] || +m[1]; return v > 0 && v < 11 ? v : null; };
  return {inn: n(/inhale[^.]*?(?:count(?:ing)? to|for(?: a count of)?)\s+(\w+)/) || 4,
          out: n(/exhale[^.]*?(?:count(?:ing)? to|for(?: a count of)?)\s+(\w+)/) || 6,
          hold: n(/hold[^.]*?(?:count(?:ing)? to|for(?: a count of)?)\s+(\w+)/) || 4,
          holds: (text.match(/\bhold\b/g) || []).length};
}
function stopPacer(){ clearTimeout(pacerT); pacerT = null; }
function runPacer(){
  stopPacer(); const p = paceOf(S._paceTool), hold = pref("hold","0") === "1";
  const seq = [["Inhale",p.inn,1]]; if(hold && p.holds) seq.push(["Hold",p.hold,1]); seq.push(["Exhale",p.out,.55]); if(hold && p.holds > 1) seq.push(["Hold",p.hold,.55]);
  let round = 1, i = 0;
  const step = () => {
    if(i >= seq.length){ i = 0; round++; }
    const w = document.getElementById("pword"), c = document.getElementById("pcount"), ring = document.getElementById("ring"), core = document.getElementById("core");
    if(!w) return stopPacer();
    if(round > 3){ w.textContent = "Well done"; c.textContent = "Now name the feeling"; ring.style.transform = core.style.transform = ""; return stopPacer(); }
    const [word, sec, sc] = seq[i];

    w.textContent = word; c.textContent = `Round ${round} of 3, count to ${sec}`;
    i++; pacerT = setTimeout(step, sec * 1000);
  };
  step();
}

  if(stepName === "example") return {title:"", back, body:`${bar}${head}<h2>How ${esc(e.example.character)} did it</h2>
    <div class="card"><p>${esc(e.example.text)}</p></div>`, action:`<button class="btn" data-go="ex:${id}:yours">Your turn</button>`};
  if(stepName === "yours"){

  }

      ${rep ? (() => { const rows = e.fields.filter(f => sv.field_ids.includes(f.id)).map(f => { const a = showVal(S.answers[e.id+"."+f.id]), b = showVal(S.answers[id+"."+f.id]); return `<p class="small"><b>${esc(f.label)}</b></p><div class="two small"><div><span class="eyebrow">Week ${weekOf(e.id)}</span><p>${esc(a||"Not filled in")}</p></div><div><span class="eyebrow">Now</span><p>${esc(b||"Not filled in")}</p></div></div>`; }).join(""); return `<div class="card"><h3>Then and now</h3>${rows}</div>`; })()
        : (e.repeat_weeks?`<p class="muted small" style="text-align:center">This one comes back in week ${e.repeat_weeks.join(", ")}, so you can see what changed.</p>`:"")}

    const soft = p => p.then(r => r, e => { console.error(e); return null; });
    const [prof, cons, enr, vault, comp, tools, dailyR, scR, ms, paid, partner, subs, settings, status] = await Promise.all([

      soft(sb.from("user_settings").select("prefs").eq("user_id", uid).maybeSingle().then(must)),
      soft(this.fn("account", {op: "status"})),
    ]);
    const keepPrefs = S.prefs, keepFilter = S.filter;
    S = blank();

    S.status = status && status.access ? status : null;
    S.partner = partner; S.pass = subs[0] || null; S.filter = keepFilter || "all";
    S.enrolments = enrols.filter(e => liveIds.includes(e.workbook_id));
    S.account = {name: prof?.display_name || USER.user_metadata?.name || "", email: USER.email};
    const latest = {}; cons.forEach(c => latest[c.consent_type] = c.granted);
    S.consentLog = cons.slice().reverse();
    S.consents = {store: !!latest.store, emails: !!latest.progress_emails, recs: !!latest.personalised_recs, news: latest.general_marketing === true, partner: !!latest.partner_share};
    S.savedConsents = {...S.consents};
    if(prof?.daily_check_time) S.dailyTime = prof.daily_check_time.slice(0,5);
    const ans = vault.answers || [], ci = vault.checkins || [];
    S.access = vault.access || "full";
    ans.forEach(a => { if(a.exercise_id === "start" && a.field_id === "why") S.why = a.value || ""; else S.answers[a.exercise_id + (a.attempt > 1 ? "~r" : "") + "." + a.field_id] = a.value; });
    comp.forEach(c => S.ex[c.exercise_id + (c.is_repeat ? "~r" : "")] = {mode: c.mode, at: Date.parse(c.completed_at)});
    tools.forEach(t => S.tool[t.card_id] = (S.tool[t.card_id] || 0) + 1);
    const checks = (dailyR?.checks || []).filter(d => d.workbook_id === "all" || d.workbook_id === WB);
    const byDay = {}; checks.forEach(d => byDay[d.check_date] = d);
    S.daily = Object.values(byDay).sort((a,b) => a.check_date.localeCompare(b.check_date)).map(d => ({date: dayFromIso(d.check_date), score: d.score, tags: (d.tags||[]).map(t => D.daily_check.tags.indexOf(t)).filter(i => i >= 0)}));
    ci.forEach(c => { S.checkinDone[c.week] = true; Object.entries(c.answers || {}).forEach(([f,v]) => S.answers["checkin" + c.week + "." + f] = v); });
    (scR?.results || []).forEach(r => { if(r.taken_week === 0){ S.baseline = r.item_scores; S.baselineSaved = true; }
      else if(r.taken_week === 6){ S.retake = r.item_scores; S.scSaved6 = true; } else if(r.taken_week === 12){ S.retake12 = r.item_scores; S.scSaved12 = true; } });
    S.ms = ms.map(m => m.milestone_id);
    S.enrolled = !!enr; S.started = !!enr; S.week = enr?.current_week || 1; S.paid = paid;
    S.weekOpenedAt = enr?.week_opened_at || null;
    S.returnedAfterGap = !!enr && enr.last_active_at && (Date.now() - Date.parse(enr.last_active_at)) > 7 * 864e5;
    if(enr && !readOnly()) sb.from("enrolments").update({last_active_at: new Date().toISOString()}).eq("user_id", uid).eq("workbook_id", WB).then(()=>{});
    applyPrefs();
  },
};

async function enter(session){
  if(USER && USER.id === session.user.id) return;

  try{ await Sync.hydrate(); }catch(e){ console.error(e); S.loadingText = "Couldn't load. Please refresh."; render(); return; }
  if(window.AkanaLocale) AkanaLocale.init(sb).then(() => render()).catch(()=>{});
  const params = new URLSearchParams(location.search);
  if(params.get("checkout") === "success"){
    history.replaceState(null, "", location.pathname);
    S.loadingText = "Confirming your payment"; go("loading");
    for(let i = 0; i < 20 && !S.paid; i++){ await new Promise(r => setTimeout(r, 1500)); S.paid = await Sync.hasAccess().catch(() => false); }
    if(S.paid){ Sync.log("purchase"); if(S.week === 1) await Sync.week(2); else go("today"); toast("You're all set. Week 2 is open."); return; }
    toast("Payment is still being confirmed. Refresh in a minute.");
  } else if(params.get("checkout") === "cancelled"){ history.replaceState(null, "", location.pathname); go("offers"); toast("Checkout canceled. Nothing was charged."); return; }
  const hash = location.hash.replace("#", "");

async function exportFlow(kind){

    const W = window.SimpleWebAuthnBrowser;
    if(kind === "setup"){
      const {options} = await Sync.fn("account", {op: "passkey_register_options"});
      const response = await W.startRegistration({optionsJSON: options});
      await Sync.fn("account", {op: "passkey_register_verify", response, nickname: "This phone"});
      S.status = {...(S.status||{}), passkeys: (S.status?.passkeys||0) + 1};
    }
    if(kind === "setup" || kind === "passkey"){
      const {options} = await Sync.fn("account", {op: "passkey_auth_options"});
      const response = await W.startAuthentication({optionsJSON: options});
      const r = await Sync.fn("account", {op: "passkey_auth_verify", response});
      return exportWithToken(r.export_token);
    }
    if(kind === "code"){
      await Sync.fn("account", {op: "export_code_request"});
      sheet(`<span class="bloom calm">${I("envelope-simple","s32")}</span><h2>Check your email</h2><p>We sent a 6-digit code to ${esc(S.account.email)}. It works for 10 minutes.</p>
        <div style="text-align:left"><label class="q" for="xcode">Code</label><input type="text" id="xcode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
        <button class="btn" data-action="export-code-verify">Download</button><button class="btn ghost" data-action="close-sheet">Cancel</button>`, "Enter your code");
    }
  }catch(e){
    if(e && (e.name === "NotAllowedError" || e.name === "AbortError")) { toast("Nothing was downloaded. You can try again anytime."); closeSheet(); return; }
    closeSheet(); Sync.fail(e);
  }
}

  if(d.sc){ scStore()[d.sc] = +d.n; render(); return; }
  if(readOnly() && (d.grid || d.wg || d.tog || d.set || d.day || d.yn)) return;
  if(d.grid){ const m = S.answers[d.grid] ||= {}; m[d.row] = +d.n; Sync.dirty(d.grid); render(); return; }
  if(d.day){ S["day_"+d.day] = +d.i; render(); return; }
  if(d.wg){ const m = S.answers[d.wg] ||= {}; (m[d.day2] ||= {})[d.row] = +d.n; Sync.dirty(d.wg); render(); return; }
  if(d.tog){ const a = S.answers[d.tog] ||= []; a[d.i] = !a[d.i]; Sync.dirty(d.tog); render(); return; }
  if(d.set){ S.answers[d.set] = +d.n; Sync.dirty(d.set); render(); return; }
  if(d.yn){ S.answers[d.yn] = d.v; Sync.dirty(d.yn); render(); return; }
  if(d.quickdaily !== undefined){ S.dailyDraft = {score: +d.quickdaily, tags: []}; saveDaily(); return; }
  if(d.plevel){ partnerOp({op: "level", share_level: +d.plevel}); return; }
  if(d.pflevel){ S.pform.level = +d.pflevel; render(); return; }
  if(d.daily !== undefined){ S.dailyDraft.score = +d.daily; render(); return; }
  if(d.tag !== undefined){ const t = S.dailyDraft.tags, i = +d.tag; t.includes(i) ? t.splice(t.indexOf(i),1) : t.push(i); render(); return; }
  const a = d.action; if(!a) return;
  if(a === "book-out"){ setTimeout(closeSheet, 300); return; }
  if(a === "help"){ S._prev = S.view === "help" ? S._prev : S.view; go("help"); }
  if(a === "to-signin"){ S.authMode = "signin"; go("onb-account"); }
  if(a === "finish-start"){ Sync.start().then(() => { S.started = true; go("home"); }).catch(Sync.fail); }
  if(a === "signup" || a === "signin" || a === "magic"){ Auth[a](); }
  if(a === "auth-mode"){ S.authMode = S.authMode === "signin" ? "signup" : "signin"; S.authError = ""; render(); }
  if(a === "save-consent"){ Sync.consents().then(() => go(S.enrolled ? "home" : "start-welcome")).catch(Sync.fail); }
  if(a === "checkout"){ Sync.checkout(); }
  if(a === "signout"){ sb.auth.signOut().then(() => { const p = S.prefs; S = blank(); S.prefs = p; USER = null; go("welcome"); }); }
  if(a === "complete-ex"){ if(readOnly()) return toast(FRIENDLY.read_only); buzz(); const first = exDoneCount() === 0; S.ex[d.id] = {mode:S.modes[d.id]||"full", at:Date.now()}; Sync.completion(d.id, S.ex[d.id].mode);
    go(`ex:${d.id}:done`); if(isRepeat(d.id)) milestone("first_repeat"); else if(first) milestone("first_exercise"); if(S.ex.e01 && S.ex.e02) milestone("stage_complete:map"); }
  if(a === "used-tool"){ const first = !Object.keys(S.tool).length; S.tool[d.id] = (S.tool[d.id]||0)+1; Sync.tool(d.id); go(S._toolBack && TAB_OF[S._toolBack] ? S._toolBack : "today", "back");
    if(first) milestone("first_toolkit_use"); const total = Object.values(S.tool).reduce((x,y)=>x+y,0);
    if(total >= 10){ const top = Object.entries(S.tool).sort((x,y)=>y[1]-x[1])[0][0]; milestone("toolkit_uses:10",{top_tool:TK[top].title}); } }
  if(a === "pacer-start") runPacer();
  if(a === "pacer-stop"){ stopPacer(); const w = document.getElementById("pword"); if(w) w.textContent = "Stopped"; }
  if(a === "cancel-start"){ const o = S.enrolments.find(e => e.workbook_id !== WB); if(o) openWorkbook(o.workbook_id); }
  if(a === "switch-wb"){ const o = S.enrolments.find(e => e.workbook_id !== WB && e.status !== "finished"); if(o) openWorkbook(o.workbook_id); }
  if(a === "not-today"){ toast("That's fine. It'll be here tomorrow."); }
  if(a === "save-daily") saveDaily();
  if(a === "close-sheet") closeSheet();
  if(a === "print") window.print();
  if(a === "calendar") downloadCalendar();
  if(a === "export") exportSheet();
  if(a === "export-passkey") exportFlow("passkey");
  if(a === "export-setup") exportFlow("setup");
  if(a === "export-code") exportFlow("code");
  if(a === "export-code-verify") exportCodeVerify();
  if(a === "use-location"){ const n = document.getElementById("geo-note"); if(n) n.textContent = "Asking your phone..."; AkanaLocale.useDevice(sb).then(r => { render(); toast(r.source === "device" ? "Region set from your location." : "Couldn't place you, so your network was used."); }).catch(() => { if(n) n.textContent = "Location wasn't allowed, so nothing changed. You can choose below."; }); }
  if(a === "delete-account") deleteFlow();
  if(a === "delete-confirm") deleteConfirm();
  if(a === "undo-delete") undoDelete();
  if(a === "cancel-pass") sheet(`<h2>Cancel your pass?</h2><p class="muted">It won't renew. If you started it in the last 14 days, it ends now and unused time is refunded. Otherwise you keep access until ${S.pass ? longDate(S.pass.current_period_end) : "the end of the period you paid for"}. Everything you wrote stays yours to read.</p><button class="btn danger" data-action="cancel-confirm">Yes, cancel my pass</button><button class="btn quiet" data-action="close-sheet">Keep my pass</button>`, "Cancel pass");
  if(a === "cancel-confirm") cancelPass();
  if(a === "partner-invite") partnerInvite();
  if(a === "partner-op") partnerOp({op: d.op});
  if(a === "partner-note") partnerOp({op: "note", note: document.getElementById("pnote")?.value || ""});
  if(a === "ci-mode"){ S.checkinShort = d.short === "1"; render(); }
  if(a === "save-checkin"){ if(readOnly()) return toast(FRIENDLY.read_only); buzz(); S.checkinDone[S.week] = true; Sync.checkin(S.week, !!S.checkinShort).then(() => {
      const st = stageOf(S.week);
      if(Math.max(...st.weeks) === S.week) Sync.event("stage_complete", {stage: st.id});
    }); go("today", "back");
    const st = stageOf(S.week), last = Math.max(...st.weeks) === S.week;
    if(S.week === 1) milestone("week_complete:1"); else if(last && st.id !== "keep" && st.id !== "map") milestone("stage_complete:" + st.id); else if(!last) toast("Check-in saved."); }
  if(a === "next-week" || a === "skip-week"){ if(S.week === 1 && !S.paid) go("offers"); else Sync.week(Math.min(12, S.week+1)); }
  if(a === "retake"){ S.retaking = true; S.retakeWeek = +d.week === 12 ? 12 : 6; if(S.retakeWeek === 12) S.retake12 = {}; else S.retake = {}; go("start-sc-0"); }
});
function refreshDone(){
  const btn = document.querySelector('[data-action="complete-ex"],[data-action="save-checkin"]');
  if(btn){ const [id] = S.view.split(":").slice(1); const e = EX[baseId(id)];
    if(e){ const mode = S.modes[id]||"full"; const fs = mode==="short" ? e.fields.filter(f=>e.short_version.field_ids.includes(f.id)) : e.fields; btn.disabled = readOnly() || !fs.every(f=>filled(id,f)); }
    else if(S.view==="checkin"){ const k="checkin"+S.week; const fs = (S.checkinShort ? D.checkin.fields.filter(f=>D.checkin.short_field_ids.includes(f.id)) : D.checkin.fields).filter(f=>f.type!=="checklist"&&f.type!=="weekly_grid"); btn.disabled = readOnly() || !fs.every(f=>filled(k,f)); } }
}
document.addEventListener("input", ev => {
  const t = ev.target, d = t.dataset;
  if(d.pf){ S.pform[d.pf] = t.value; return; }
  if(d.acc){ S.account[d.acc] = t.value; return; }
  if(d.why !== undefined){ S.why = t.value; Sync.dirty("start.why"); const b = document.querySelector('[data-go="start-time"]'); if(b) b.disabled = !t.value.trim(); return; }
  if(d.dtime !== undefined){ S.dailyTime = t.value; return; }
  if(d.k){
    if(readOnly()) return;
    if(d.j !== undefined){ const a = S.answers[d.k] ||= [["",""],["",""]]; a[+d.i][+d.j] = t.value; }
    else if(d.i !== undefined){ const a = S.answers[d.k] ||= []; a[+d.i] = t.value; }
    else S.answers[d.k] = t.value;
    Sync.dirty(d.k);
    refreshDone();
  }
});
document.addEventListener("change", ev => {
  const t = ev.target, d = t.dataset;
  if(d.consentpref){ Sync.setConsent(d.consentpref, t.checked).then(flashSaved).catch(e => { t.checked = !t.checked; Sync.fail(e); }); return; }
  if(d.localpref){ setPref(d.localpref, t.checked ? "1" : "0"); if(d.localpref === "haptics" && t.checked) buzz(); flashSaved(); return; }
  if(d.pref){ S.prefs[d.pref] = t.checked; Sync.savePrefs(); flashSaved(); if(d.pref === "hide_covers") render(); return; }
  if(d.pfagree !== undefined){ S.pform.agree = t.checked; return; }
  if(d.setname !== undefined){ S.account.name = t.value.trim(); sb.from("profiles").update({display_name: S.account.name || null}).eq("id", USER.id).then(r => r.error ? Sync.fail(r.error) : toast("Saved.")); return; }
  if(d.settime !== undefined){ S.dailyTime = t.value; sb.from("profiles").update({daily_check_time: t.value || null}).eq("id", USER.id).then(r => r.error ? Sync.fail(r.error) : flashSaved()); return; }
  if(d.consent){ S.consents[d.consent] = t.checked; render(); }
  if(d.cl){ if(readOnly()) return; const a = S.answers[d.cl] ||= []; a[+d.i] = t.checked; Sync.dirty(d.cl); refreshDone(); }
  if(d.tick){ if(d.tick === "now") S.tickNow = t.checked; else S.tickRenew = t.checked; render(); }
});
boot();
</script>
