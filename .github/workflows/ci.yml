name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Migrate the v1 workbooks and validate every v3 file
        run: |
          pnpm migrate:v1 --check
          pnpm validate --parked
      - name: Python validator cross-check (kept until the TypeScript port agrees on all 20 files)
        run: |
          pip install jsonschema
          cd legacy && python3 tools/validate.py content/workbooks/[a-z]*.json > /tmp/py.txt 2>&1 || true
          # Content issues on the 20 Maya Vaughn files are parked; this step only
          # proves the Python validator still runs. Agreement is checked by hand
          # until the parked issues are cleared.
          grep -c "^  - " /tmp/py.txt || true

  build:
    name: Build web, check client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm --filter @akana/web build
      - name: Service role key name must not reach a client bundle
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY" apps/web/.next/static; then
            echo "service role key name found in client output"; exit 1
          fi
      - name: No third-party script origins in the CSP
        run: node scripts/check-csp.mjs

  database:
    name: Migrations and RLS isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: bash scripts/db-test.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
