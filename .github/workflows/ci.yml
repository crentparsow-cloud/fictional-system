name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for every job. A job that needs more asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Audit production dependencies (high and critical)
        # Not blocking yet: zod 3 has an open high advisory (docs/security/zod-4-assessment.md).
        # Remove continue-on-error once that is closed or accepted in writing, so a new
        # high or critical advisory fails the pull request.
        continue-on-error: true
        run: pnpm audit --prod --audit-level high
      - name: Migrate the v1 workbooks and validate every v3 file
        run: |
          pnpm migrate:v1 --check
          pnpm validate --parked
      - name: Python validator cross-check (kept until the TypeScript port agrees on all 20 files)
        run: |
          pip install jsonschema
          cd legacy && python3 tools/validate.py content/workbooks/[a-z]*.json > /tmp/py.txt 2>&1 || true
          # Content issues on the 20 Maya Vaughn files are parked; this step only
          # proves the Python validator still runs. Agreement is checked by hand
          # until the parked issues are cleared.
          grep -c "^  - " /tmp/py.txt || true

  build:
    name: Build web, check client bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm --filter @akana/web build
      - name: Service role key name must not reach a client bundle
        run: |
          if grep -rl "SUPABASE_SERVICE_ROLE_KEY" apps/web/.next/static; then
            echo "service role key name found in client output"; exit 1
          fi
      - name: No third-party script origins in the CSP
        run: node scripts/check-csp.mjs

  database:
    name: Migrations and RLS isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - run: bash scripts/db-test.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  e2e:
    name: End-to-end smoke (local build, signed out)
    # Pinned: Playwright cannot install its browser dependencies on the newest runner image yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The "local" Playwright project only: it serves the build with placeholder
    # Supabase settings and never signs in, so it needs no secrets (docs/TESTING.md).
    env:
      CI: "true"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: pnpm install
      - run: pnpm --filter @akana/web exec playwright install --with-deps chromium
      - run: pnpm --filter @akana/web build
      - run: pnpm --filter @akana/web e2e
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/node_modules/.e2e
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    # Pull requests only. Scans the commits the pull request adds, not the whole history.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version, checked against its hash)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .
